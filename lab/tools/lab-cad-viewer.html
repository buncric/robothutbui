<!doctype html>
<html><head><meta charset="utf-8"><title>Lab CAD viewer</title>
<style>html,body{margin:0;background:#e9edf1;font:12px system-ui}#g{display:grid;grid-template-columns:1fr 1fr;width:1600px;height:1200px}canvas{display:block}#t{position:fixed;left:8px;top:6px;color:#223}</style></head>
<body><div id="t"></div><div id="g"></div>
<script type="module">
// Xem nhanh GLB phòng lab (cad/src/lab → public/models/lab/<id>.glb): 4 góc nhìn, ánh sáng giống phòng lab.
// ?m=<id>[&views=iso,front,top,back][&zoom=1][&node=tên] — node: phóng to vào node đó
import * as THREE from 'three';
import { GLTFLoader } from 'three/examples/jsm/loaders/GLTFLoader.js';
import { RoomEnvironment } from 'three/examples/jsm/environments/RoomEnvironment.js';
const qs = new URLSearchParams(location.search);
const id = qs.get('m') || 'soldering-station';
const views = (qs.get('views') || 'iso,front,back,top').split(',');
const W = 800, H = 600;
const r = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
r.setSize(1600, 1200); r.setPixelRatio(1);
r.toneMapping = THREE.ACESFilmicToneMapping; r.toneMappingExposure = 0.95; r.outputColorSpace = THREE.SRGBColorSpace;
r.shadowMap.enabled = true;
document.getElementById('g').replaceWith(r.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color(0xe9edf1);
const pm = new THREE.PMREMGenerator(r); scene.environment = pm.fromScene(new RoomEnvironment(), 0.04).texture; scene.environmentIntensity = 0.6;
scene.add(new THREE.HemisphereLight(0xf2f5ff, 0x8a8478, 1.2));
const sun = new THREE.DirectionalLight(0xfff4e6, 2.2); sun.position.set(0.6, 1, 0.8); sun.castShadow = true; scene.add(sun);
const glb = await new GLTFLoader().loadAsync(`/public/models/lab/${id}.glb`).catch(() => new GLTFLoader().loadAsync(`/models/lab/${id}.glb`));
const root = glb.scene; root.scale.setScalar(1000); scene.add(root);
root.traverse((o) => { if (o.isMesh) { o.castShadow = o.receiveShadow = true; } });
root.updateMatrixWorld(true);
let target = root; const nn = qs.get('node'); if (nn) target = root.getObjectByName(nn) || root;
const bb = new THREE.Box3().setFromObject(target), c = bb.getCenter(new THREE.Vector3()), s = bb.getSize(new THREE.Vector3());
const R = Math.max(s.x, s.y, s.z) * 0.62 / (+qs.get('zoom') || 1) + 1;
const floor = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), new THREE.MeshStandardMaterial({ color: 0xcfd4d8, roughness: 0.8 }));
floor.rotation.x = -Math.PI / 2; floor.scale.setScalar(R * 12); floor.position.y = new THREE.Box3().setFromObject(root).min.y - 0.2; floor.receiveShadow = true; scene.add(floor);
sun.position.copy(c).add(new THREE.Vector3(0.6, 1, 0.8).multiplyScalar(R * 6)); sun.target.position.copy(c); scene.add(sun.target);
const sc = sun.shadow.camera; sc.left = sc.bottom = -R * 3; sc.right = sc.top = R * 3; sc.far = R * 20; sun.shadow.mapSize.set(2048, 2048);
const dirs = { iso: [0.9, 0.7, 1.2], front: [0, 0.25, 1], back: [-0.9, 0.6, -1], top: [0.001, 1, 0.25], left: [-1, 0.3, 0.2], right: [1, 0.3, 0.2], low: [0.6, 0.12, 1] };
const cam = new THREE.PerspectiveCamera(30, W / H, R * 0.02, R * 100);
r.setScissorTest(true);
views.slice(0, 4).forEach((v, i) => {
  const d = new THREE.Vector3(...(dirs[v] || dirs.iso)).normalize();
  cam.position.copy(c).addScaledVector(d, R * 3.3); cam.lookAt(c); cam.updateProjectionMatrix();
  const x = (i % 2) * W, y = (1 - Math.floor(i / 2)) * H;
  r.setViewport(x, y, W, H); r.setScissor(x, y, W, H); r.render(scene, cam);
});
let tris = 0, meshes = 0; root.traverse((o) => { if (o.isMesh) { meshes++; tris += (o.geometry.index ? o.geometry.index.count : o.geometry.attributes.position.count) / 3; } });
document.getElementById('t').textContent = `${id} · ${s.x.toFixed(0)}×${s.y.toFixed(0)}×${s.z.toFixed(0)} mm · ${meshes} mesh · ${Math.round(tris)} tris`;
window.done = { size: [s.x, s.y, s.z].map((v) => +v.toFixed(1)), meshes, tris: Math.round(tris), names: (() => { const n = []; root.traverse((o) => o.name && n.push(o.name)); return n; })() };
</script></body></html>
